<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="Entrenador guiado para tu rutina de gimnasio"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Mi entrenador</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f30;--line:#2b3a50;--text:#f3f6fb;--muted:#aab7ca;--accent:#8bd3a8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101b2d,#080e18 65%);color:var(--text);font:16px system-ui;min-height:100vh}header,main{max-width:680px;margin:auto;padding:20px 15px}h1{margin:0 0 5px;font-size:27px}h2{margin:0 0 6px}.sub,.meta,.small{color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 0}.tab,button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:12px}.tab{background:var(--panel);color:var(--muted);border:1px solid var(--line);font-size:13px;font-weight:700}.tab.active{background:#244236;color:#b5f0c8}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:7px;background:#29374b;border-radius:9px;overflow:hidden;margin:14px 0 7px}.bar{height:100%;background:var(--accent);width:0}.step{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.exercise-name{font-size:25px;font-weight:850;line-height:1.15;margin:10px 0 6px}.target{color:var(--muted);font-size:14px}.hint{background:#0d1726;border:1px solid var(--line);padding:12px;border-radius:12px;margin:15px 0;font-size:13px;color:var(--muted)}.setrow{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;align-items:center;margin:9px 0}.setrow label{font-size:13px;color:var(--muted)}input{width:100%;min-width:0;background:#0d1726;border:1px solid #35465e;border-radius:10px;color:white;padding:13px 9px;font:16px system-ui}input::placeholder{color:#73839a}.unit{font-size:11px;color:var(--muted);margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.primary{background:var(--accent);color:#102019;font-weight:800}.secondary{background:#1b2940;color:white;border:1px solid var(--line)}.wide{grid-column:1/-1}.timer{display:flex;justify-content:space-between;align-items:center;gap:10px}.time{font-size:26px;font-weight:850;font-variant-numeric:tabular-nums}.timer button{padding:9px 12px}.history-item{padding:12px 0;border-top:1px solid var(--line)}.history-item:first-child{border:0}.history-item strong{display:block}.empty{color:var(--muted)}.section-title{font-size:18px;margin:24px 2px 8px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}.complete{text-align:center;padding:18px 4px}.complete .big{font-size:45px;margin:8px}.notice{color:#b5f0c8;font-size:13px;margin-top:8px}@media(min-width:500px){.exercise-name{font-size:30px}.card{padding:21px}}
</style></head><body><header><h1>Mi entrenador</h1><div class="sub">Te guía ejercicio a ejercicio y recuerda tus cargas.</div></header><main><nav class="tabs" id="tabs"></nav><section class="card" id="guide"></section><section class="card"><div class="timer"><div><div class="small">DESCANSO ENTRE SERIES</div><div class="time" id="clock">01:30</div></div><div><button class="secondary" id="minus">−15 s</button> <button class="primary" id="start">Iniciar</button></div></div><div class="small">Elige iniciar al acabar una serie.</div></section><h2 class="section-title">Últimas sesiones</h2><section class="card" id="history"></section><div class="footer">Tus datos se guardan en este móvil. Usa «Exportar datos» para guardar una copia.</div></main>
<script>
const plans=[
{id:'lun',tab:'LUN',title:'Superior A',duration:'55–65 min',items:[['Press banca barra','8–10',3,90],['Jalón al pecho','10–12',3,75],['Press inclinado mancuernas','10',3,75],['Remo sentado polea','10–12',3,75],['Elevaciones laterales','12–15',3,60],['Tríceps polea','12',2,60],['Curl bíceps mancuernas','12',2,60]]},
{id:'mie',tab:'MIÉ',title:'Piernas',duration:'45–55 min',items:[['Sentadilla barra','6–8',2,120],['Peso muerto rumano','8',2,120],['Sentadilla búlgara','8 por pierna',2,90],['Curl femoral sentado','10–12',2,75],['Gemelos','12–15',2,60],['Plancha abdominal','40–60 s',3,60]]},
{id:'jue',tab:'JUE',title:'Funcional + core',duration:'30–35 min · baja fatiga',items:[['Pallof press','12 por lado',3,45],['Plancha','40–45 s',3,45],['Plancha lateral','30 s por lado',2,45],['Bird dog','10 por lado',2,45],['Puente glúteos','12',2,45],['Rotación externa hombro con goma','15',2,45],['Face pull ligero','15',2,45]]},
{id:'vie',tab:'VIE',title:'Superior B',duration:'55–65 min',items:[['Dominadas asistidas','8–10',3,90],['Press inclinado mancuernas','8–10',3,75],['Remo pecho apoyado','10',3,75],['Aperturas polea','12–15',2,60],['Pájaros máquina','12–15',3,60],['Curl bíceps banco Scott','10–12',3,60],['Extensión tríceps sobre cabeza','10–12',3,60]]}];
const $=s=>document.querySelector(s);let active='lun',timer=null,remaining=90;
const load=()=>JSON.parse(localStorage.getItem('gymData')||'{"sessions":[],"draft":{}}'),save=d=>localStorage.setItem('gymData',JSON.stringify(d));
const state=()=>{let d=load();d.guided=d.guided||{};return d};
function latestWeight(day,name,setNo){let sessions=load().sessions||[];for(let s of sessions){if(s.day!==day)continue;let e=(s.entries||[]).find(x=>x.exercise===name&&x.set===setNo&&x.kg);if(e)return e.kg}return ''}
function startDay(id){let d=state();active=id;if(!d.guided[id]||d.guided[id].finished){d.guided[id]={index:0,entries:[],started:new Date().toISOString(),finished:false}}save(d);render()}
function renderTabs(){let d=state();$('#tabs').innerHTML=plans.map(p=>'<button class="tab '+(p.id===active?'active':'')+'" data-id="'+p.id+'">'+p.tab+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>startDay(b.dataset.id))}
function renderGuide(){let p=plans.find(x=>x.id===active),d=state(),g=d.guided[active];if(!g){g={index:0,entries:[],finished:false};d.guided[active]=g;save(d)}let total=p.items.length,idx=g.index;
if(g.finished||idx>=total){$('#guide').innerHTML='<div class="complete"><div class="big">✓</div><h2>¡Entrenamiento terminado!</h2><p class="meta">'+p.title+' · '+total+' ejercicios completados</p><button class="primary wide" id="again">Repetir entrenamiento</button><button class="secondary wide" id="export">Exportar datos</button></div>';$('#again').onclick=()=>startDay(active);$('#export').onclick=exportData;return}
let ex=p.items[idx],name=ex[0],reps=ex[1],sets=ex[2],rest=ex[3],done=g.entries.filter(e=>e.exercise===name).length;
let previous=latestWeight(p.title,name,1),existing=g.entries.filter(e=>e.exercise===name);
let h='<div class="dayhead"><div><div class="step">'+p.title+' · '+p.duration+'</div></div><div class="meta">Ejercicio '+(idx+1)+' de '+total+'</div></div><div class="progress"><div class="bar" style="width:'+Math.round(idx/total*100)+'%"></div></div><div class="exercise-name">'+name+'</div><div class="target">'+sets+' series · '+reps+' repeticiones · descanso '+rest+' s</div>';
h+='<div class="hint">'+(previous?'Última vez utilizaste <b>'+previous+' kg</b> en este ejercicio. Te lo dejo como referencia; ajusta si hace falta.':'Primera vez que registras este ejercicio: elige un peso cómodo que te permita completar las repeticiones con buena técnica y dejando 2–3 repeticiones en reserva.')+'</div>';
for(let s=1;s<=sets;s++){let old=existing.find(e=>e.set===s),kg=old?old.kg:(s===1?previous:previous),rv=old?old.reps:reps.split('–')[0];h+='<div class="setrow"><label>Serie '+s+'</label><div><input type="number" min="0" step=".5" inputmode="decimal" placeholder="Peso" id="kg'+s+'" value="'+(kg||'')+'"><div class="unit">kg</div></div><div><input type="text" inputmode="text" placeholder="Reps" id="rep'+s+'" value="'+(rv||'')+'"><div class="unit">repeticiones</div></div></div>'}
h+='<div class="actions"><button class="secondary" id="prev" '+(idx===0?'disabled':'')+'>Anterior</button><button class="secondary" id="skip">Saltar</button><button class="primary wide" id="next">Ejercicio completado →</button><button class="secondary wide" id="export">Exportar datos</button></div><div class="notice">Al avanzar se guardarán las series y aparecerá el siguiente ejercicio.</div>';
$('#guide').innerHTML=h;
$('#next').onclick=()=>advance(false);$('#skip').onclick=()=>advance(true);$('#prev').onclick=()=>{g.index=Math.max(0,g.index-1);save(d);render()};$('#export').onclick=exportData;
}
function advance(skip){let d=state(),p=plans.find(x=>x.id===active),g=d.guided[active],ex=p.items[g.index];if(!skip){for(let s=1;s<=ex[2];s++){let kg=$('#kg'+s).value.trim(),reps=$('#rep'+s).value.trim();if(!kg||!reps){alert('Completa el peso y las repeticiones de todas las series.');return}g.entries=g.entries.filter(e=>!(e.exercise===ex[0]&&e.set===s));g.entries.push({exercise:ex[0],set:s,kg,reps,done:true})}}g.index++;if(g.index>=p.items.length){g.finished=true;d.sessions.unshift({date:new Date().toISOString(),day:p.title,entries:g.entries});d.sessions=d.sessions.slice(0,100)}d.guided[active]=g;save(d);render()}
function renderHistory(){let a=load().sessions||[];$('#history').innerHTML=a.length?a.slice(0,8).map(s=>'<div class="history-item"><strong>'+s.day+'</strong><span class="small">'+new Date(s.date).toLocaleString('es-ES')+'</span><div class="small">'+s.entries.map(e=>e.exercise+': '+e.kg+' kg × '+e.reps).join(' · ')+'</div></div>').join(''):'<div class="empty">Cuando termines tu primera sesión, aparecerá aquí.</div>'}
function exportData(){let b=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mi-entrenamiento-datos.json';a.click();URL.revokeObjectURL(a.href)}
function render(){renderTabs();renderGuide();renderHistory()}
function showTime(){let m=Math.floor(remaining/60),s=remaining%60;$('#clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
$('#start').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#start').textContent='Continuar';return}$('#start').textContent='Pausar';timer=setInterval(()=>{remaining--;showTime();if(remaining<=0){clearInterval(timer);timer=null;$('#start').textContent='Iniciar';if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)};
$('#minus').onclick=()=>{remaining=Math.max(0,remaining-15);showTime()};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();showTime();
</script></body></html>
