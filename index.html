<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="Rutina, registro de cargas e historial de entrenamiento"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Mi entrenamiento</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#151f30;--line:#2b3a50;--text:#f3f6fb;--muted:#aab7ca;--accent:#8bd3a8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101b2d,#080e18 65%);color:var(--text);font:16px system-ui;min-height:100vh}header,main{max-width:850px;margin:auto;padding:20px 15px}h1{margin:0 0 5px;font-size:27px}.sub,.meta,.small{color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.tab,button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px}.tab{background:var(--panel);color:var(--muted);border:1px solid var(--line);font-size:13px;font-weight:700}.tab.active{background:#244236;color:#b5f0c8}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.dayhead,.timer{display:flex;justify-content:space-between;align-items:center;gap:10px}.dayhead h2{margin:0 0 4px}.progress{height:7px;background:#29374b;border-radius:9px;overflow:hidden;margin:14px 0 5px}.bar{height:100%;background:var(--accent);width:0}.exercise{padding:14px 0;border-top:1px solid var(--line)}.ex-title{font-weight:750}.ex-meta{color:var(--muted);font-size:13px;margin:4px 0 10px}.sets{display:grid;gap:7px}.set{display:grid;grid-template-columns:32px 1fr 1fr 40px;gap:7px;align-items:center}.setnum{font-size:13px;color:var(--muted)}input{min-width:0;width:100%;background:#0d1726;border:1px solid #35465e;border-radius:9px;color:white;padding:10px 7px;font:14px system-ui}.check{height:40px;background:#29374b;color:white}.check.done{background:#2c6549}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:var(--accent);color:#102019;font-weight:700}.secondary{background:#1b2940;color:white;border:1px solid var(--line)}.time{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}.history-item{padding:12px 0;border-top:1px solid var(--line)}.history-item:first-child{border:0}.history-item strong{display:block}.empty{color:var(--muted)}.section-title{font-size:18px;margin:24px 2px 8px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}@media(min-width:650px){.tab{font-size:14px}}
</style></head><body><header><h1>Mi entrenamiento</h1><div class="sub">Rutina, cargas e historial · datos guardados en este dispositivo</div></header><main><nav class="tabs" id="tabs"></nav><section class="card" id="workout"></section><section class="card"><div class="timer"><div><div class="small">DESCANSO</div><div class="time" id="clock">01:30</div></div><div class="actions"><button class="secondary" id="minus">−15 s</button><button class="primary" id="start">Iniciar</button><button class="secondary" id="reset">Reset</button></div></div><div class="small">Temporizador entre series.</div></section><h2 class="section-title">Historial</h2><section class="card" id="history"></section><div class="footer">Los registros se almacenan localmente. Exporta una copia periódicamente.</div></main>
<script>
const plans=[
{id:'lun',tab:'LUN',title:'Superior A',duration:'55–65 min',items:[['Press banca barra','3 × 8–10',90],['Jalón al pecho','3 × 10–12',75],['Press inclinado mancuernas','3 × 10',75],['Remo sentado polea','3 × 10–12',75],['Elevaciones laterales','3 × 12–15',60],['Tríceps polea','2 × 12',60],['Curl bíceps mancuernas','2 × 12',60]]},
{id:'mie',tab:'MIÉ',title:'Piernas',duration:'45–55 min',items:[['Sentadilla barra','2–3 × 6–8',120],['Peso muerto rumano','2–3 × 8',120],['Sentadilla búlgara','2 × 8 por pierna',90],['Curl femoral sentado','2 × 10–12',75],['Gemelos','2 × 12–15',60],['Plancha abdominal','3 × 40–60 s',60]]},
{id:'jue',tab:'JUE',title:'Funcional + core',duration:'30–35 min · baja fatiga',items:[['Pallof press','3 × 12 por lado',45],['Plancha','3 × 40–45 s',45],['Plancha lateral','2 × 30 s por lado',45],['Bird dog','2 × 10 por lado',45],['Puente glúteos','2 × 12',45],['Rotación externa hombro con goma','2 × 15',45],['Face pull ligero','2 × 15',45]]},
{id:'vie',tab:'VIE',title:'Superior B',duration:'55–65 min',items:[['Dominadas asistidas','3 × 8–10',90],['Press inclinado mancuernas','3 × 8–10',75],['Remo pecho apoyado','3 × 10',75],['Aperturas polea','2 × 12–15',60],['Pájaros máquina','3 × 12–15',60],['Curl bíceps banco Scott','3 × 10–12',60],['Extensión tríceps sobre cabeza','3 × 10–12',60]]}];
const $=s=>document.querySelector(s);let active='lun',timer=null,remaining=90;
const load=()=>JSON.parse(localStorage.getItem('gymData')||'{"sessions":[],"draft":{}}'),save=d=>localStorage.setItem('gymData',JSON.stringify(d)),key=(d,e,s)=>d+'_'+e+'_'+s;
function renderTabs(){$('#tabs').innerHTML=plans.map(p=>'<button class="tab '+(p.id===active?'active':'')+'" data-id="'+p.id+'">'+p.tab+'</button>').join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()})}
function renderWorkout(){const p=plans.find(x=>x.id===active),d=load(),draft=d.draft||{};let total=0,done=0,h='<div class="dayhead"><div><h2>'+p.title+'</h2><div class="meta">'+p.duration+'</div></div><div class="small">'+p.items.length+' ejercicios</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="small" id="pct"></div>';
p.items.forEach((ex,i)=>{let n=Number(ex[1].split(' ')[0]);total+=n;h+='<div class="exercise"><div class="ex-title">'+ex[0]+'</div><div class="ex-meta">'+ex[1]+' · descanso '+ex[2]+' s</div><div class="sets">';for(let s=0;s<n;s++){let k=key(active,i,s),v=draft[k]||{};if(v.done)done++;h+='<div class="set"><span class="setnum">S'+(s+1)+'</span><input type="number" step=".5" placeholder="kg" aria-label="kg" data-k="'+k+'" data-f="kg" value="'+(v.kg||'')+'"><input type="number" placeholder="reps" aria-label="repeticiones" data-k="'+k+'" data-f="reps" value="'+(v.reps||'')+'"><button class="check '+(v.done?'done':'')+'" data-k="'+k+'">'+(v.done?'✓':'○')+'</button></div>'}h+='</div></div>'});
h+='<div class="actions"><button class="primary" id="finish">Finalizar sesión</button><button class="secondary" id="clear">Reiniciar día</button><button class="secondary" id="export">Exportar datos</button></div>';$('#workout').innerHTML=h;progress(done,total);
document.querySelectorAll('input[data-k]').forEach(el=>el.onchange=()=>{let x=load();x.draft=x.draft||{};x.draft[el.dataset.k]=x.draft[el.dataset.k]||{};x.draft[el.dataset.k][el.dataset.f]=el.value;save(x)});
document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{let x=load();x.draft=x.draft||{};x.draft[b.dataset.k]=x.draft[b.dataset.k]||{};x.draft[b.dataset.k].done=!x.draft[b.dataset.k].done;save(x);renderWorkout()});
$('#finish').onclick=finish;$('#clear').onclick=()=>{if(confirm('¿Reiniciar los registros de este día?')){let x=load();p.items.forEach((_,i)=>{for(let s=0;s<3;s++)delete x.draft[key(active,i,s)]});save(x);renderWorkout()}};$('#export').onclick=exportData}
function progress(done,total){let n=total?Math.round(done/total*100):0;$('#bar').style.width=n+'%';$('#pct').textContent=n+'% completado · '+done+'/'+total+' series'}
function finish(){let d=load(),p=plans.find(x=>x.id===active),entries=[];p.items.forEach((ex,i)=>{for(let s=0;s<3;s++){let v=d.draft&&d.draft[key(active,i,s)];if(v&&(v.kg||v.reps||v.done))entries.push({exercise:ex[0],set:s+1,kg:v.kg||'',reps:v.reps||'',done:!!v.done})}});if(!entries.length){alert('Introduce algún peso o repetición antes de finalizar.');return}d.sessions.unshift({date:new Date().toISOString(),day:p.title,entries});d.draft={};save(d);render();alert('Sesión guardada en el historial.')}
function renderHistory(){let a=load().sessions||[];$('#history').innerHTML=a.length?a.slice(0,30).map(s=>'<div class="history-item"><strong>'+s.day+'</strong><span class="small">'+new Date(s.date).toLocaleString('es-ES')+' · '+s.entries.length+' registros</span><div class="small">'+s.entries.map(e=>e.exercise+': '+(e.kg?e.kg+' kg':'')+(e.reps?' × '+e.reps+' reps':'')).join(' · ')+'</div></div>').join(''):'<div class="empty">Todavía no hay sesiones guardadas.</div>'}
function exportData(){let b=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mi-entrenamiento-datos.json';a.click();URL.revokeObjectURL(a.href)}
function render(){renderTabs();renderWorkout();renderHistory()}
function showTime(){let m=Math.floor(remaining/60),s=remaining%60;$('#clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
$('#start').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#start').textContent='Continuar';return}$('#start').textContent='Pausar';timer=setInterval(()=>{remaining--;showTime();if(remaining<=0){clearInterval(timer);timer=null;$('#start').textContent='Iniciar';if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)};
$('#reset').onclick=()=>{clearInterval(timer);timer=null;remaining=90;$('#start').textContent='Iniciar';showTime()};$('#minus').onclick=()=>{remaining=Math.max(0,remaining-15);showTime()};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();showTime();
</script></body></html>
